name: Monero Security Review

on:
  workflow_dispatch:
    inputs:
      pr:
        description: "Upstream PR number, or 'sweep' to take the next MAX_AGE_DAYS/BATCH from the queue"
        required: true
        default: sweep
        type: string
      model:
        description: "Model"
        required: false
        default: claude-opus-5
        type: choice
        options:
          - claude-opus-5
          - claude-sonnet-5

  # Twice an hour, off the top of the hour.
  #
  # This schedule is a BACKUP AND A DIAGNOSTIC, not the clock. GitHub's
  # scheduler dropped every tick this repo ever asked for -- see "the schedule"
  # in the README for the measurement and the cause. Drive the drip from
  # something that actually keeps time (an external `gh workflow run`, or
  # scripts/drip.sh) and treat a run appearing here as a bonus.
  #
  # Two ticks an hour, not `*/5`: if the registration ever unsticks, a
  # five-minute cron starts allocating 288 run records a day, nearly all of
  # which the concurrency group cancels while still pending. Twice an hour is
  # enough to restart a stalled queue and costs nothing when it does not fire.
  #
  # Do not "fix" this by moving the minute again. Every minute-of-hour has
  # already been tried (:00/:30, :17, :07/:27/:47, and all five residues mod 5
  # via `*/5`) and none of them fired. Congestion is not the cause.
  #
  # Stop it without editing this file:
  #   gh variable set REVIEW_PAUSED --body 1 --repo <this repo>
  schedule:
    - cron: "23,53 * * * *"

env:
  UPSTREAM: monero-project/monero
  # Only consider PRs touched this recently. Upstream is busier than it looks:
  # measured 2026-08-26, the starting queue is ~22 PRs at 1 day, ~33 at 2,
  # ~42 at 3. Start at 1 so the first drain is survivable, then widen.
  # 0 = no age limit: every open PR is eligible, so the queue works through the
  # backlog instead of only watching the last day. Sorting is still
  # most-recently-active first, so fresh pushes keep priority and old PRs are
  # reached only when nothing newer is unreviewed. Set this back to 1 once the
  # backlog is done and you only want to track new activity.
  MAX_AGE_DAYS: 0
  # PRs reviewed per tick. Keep at 1: the drip's rate is set by how often
  # something dispatches this workflow, not by how much each run swallows.
  # Two PRs per dispatch while draining the ~250-deep backlog. They run as
  # separate matrix legs, one at a time, each with its own timeout -- so this
  # doubles throughput per tick without running two reviews concurrently.
  # Drop back to 1 when the backlog is done.
  BATCH: 2

# One review at a time, repo-wide. Rapid ticks collapse into a single pending
# run rather than stacking, and no two runs can pick the same PR concurrently.
concurrency:
  group: monero-review
  cancel-in-progress: false

permissions: {}

jobs:
  # The work queue. A manual dispatch with a number reviews exactly that PR.
  # Otherwise this picks unreviewed PRs -- deduplication happens HERE, from two
  # cheap API calls, so a tick with nothing to do never starts a review runner.
  select:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
    outputs:
      prs: ${{ steps.pick.outputs.prs }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - id: pick
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REVIEW_REPO: ${{ github.repository }}
          WANT: ${{ inputs.pr || 'sweep' }}
          PAUSED: ${{ vars.REVIEW_PAUSED }}
        run: |
          set -euo pipefail
          if [[ "$WANT" =~ ^[0-9]+$ ]]; then
            echo "prs=[\"$WANT\"]" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Kill switch: `gh variable set REVIEW_PAUSED --body 1` stops sweeps.
          # Deliberately not gated on event_name == schedule: an externally
          # driven drip (a real crontab calling `gh workflow run -f pr=sweep`,
          # because GitHub's scheduler is unreliable) arrives as a
          # workflow_dispatch, and the brake has to work for it too. Reviewing
          # one PR by number still works while paused -- that path already
          # returned above.
          if [ "${PAUSED:-}" = "1" ]; then
            echo "sweep paused via REVIEW_PAUSED"
            echo "prs=[]" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 scripts/select_prs.py >> "$GITHUB_OUTPUT"

  review:
    needs: select
    if: needs.select.outputs.prs != '' && needs.select.outputs.prs != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      issues: write
      id-token: write
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        pr: ${{ fromJSON(needs.select.outputs.prs) }}
    steps:
      # Every PR in a public repo exposes its head at refs/pull/N/head, so no
      # mirror is needed. Blobless partial clone keeps this fast on a ~208MB
      # repo while retaining the history that merge-base needs.
      - name: Fetch upstream PR ${{ matrix.pr }}
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-tags --single-branch --branch master \
            "https://github.com/$UPSTREAM.git" .
          git fetch --filter=blob:none origin \
            "+refs/pull/${{ matrix.pr }}/head:refs/heads/pr"
          git checkout --quiet pr
          # Fixed 12 chars, not --short: `select` compares against this prefix
          # and git's abbreviation length is not stable across repo states.
          echo "HEAD_SHA=$(git rev-parse HEAD | cut -c1-12)" >> "$GITHUB_ENV"

      - name: Fetch PR description
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/$UPSTREAM/pulls/${{ matrix.pr }}" \
            --jq '"# \(.title)\n\n\(.body // "(no description)")"' > PR_CONTEXT.md

      # The skill lives in this repo, not in Monero. Graft it onto the checkout.
      - name: Add the review skill
        uses: actions/checkout@v6
        with:
          path: .harness
          persist-credentials: false
      - run: cp -r .harness/.claude .claude

      # Precise cross-reference beats grep for "who calls this", which is the
      # load-bearing claim in every finding. ctags/cscope parse source text
      # only -- nothing from the PR is configured, compiled, or executed.
      # Non-fatal: a flaky apt mirror must not cost a whole review. The skill
      # detects a missing index and says so rather than claiming reachability
      # it could not verify.
      - name: Build symbol index
        continue-on-error: true
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq universal-ctags cscope
          bash .harness/scripts/build_index.sh .

      - run: echo "T0=$(date +%s)" >> "$GITHUB_ENV"

      # No GitHub tools, no network: Claude reads the diff and writes review.md.
      # The workflow, not the model, decides what happens to that file. The code
      # under review is written by strangers, so it gets no outward capability.
      - id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: "/monero-security-review"
          claude_args: |
            --model ${{ inputs.model || 'claude-sonnet-5' }}
            --max-turns 60
            --allowedTools "Read,Grep,Glob,Write,Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git blame:*),Bash(git merge-base:*),Bash(readtags:*),Bash(cscope:*)"

      # Only verify if the first pass actually found something. Most PRs
      # produce no findings, and there is nothing to refute in an empty report.
      - name: Anything to verify?
        id: triage
        run: |
          # Match a severity-tagged finding heading, not the section header.
          # Pass 1 sometimes writes "## Findings" followed by "None." despite
          # being told to omit the section, and grepping the header alone paid
          # for a whole verification pass with nothing to verify.
          if [ -s review.md ] && \
             grep -Eq '^###[[:space:]]*\[(CRITICAL|HIGH|MEDIUM|LOW)' review.md; then
            echo "verify=true" >> "$GITHUB_OUTPUT"
            echo "first pass produced findings, running verification"
          else
            echo "no severity-tagged findings, skipping verification"
          fi

      # Adversarial second pass: attack every finding, default verdict REFUTED.
      # Same capabilities as the first pass -- still nothing outward-facing.
      - id: refute
        if: steps.triage.outputs.verify == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: "/monero-review-refute"
          claude_args: |
            --model ${{ inputs.model || 'claude-sonnet-5' }}
            --max-turns 40
            --allowedTools "Read,Grep,Glob,Write,Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git blame:*),Bash(git merge-base:*),Bash(readtags:*),Bash(cscope:*)"

      # Footer with cost/tokens/duration, summed across both passes. Generated
      # by the workflow, not the model, so the numbers can't be invented.
      - name: Append run telemetry
        if: always()
        env:
          EXEC_FILE: ${{ steps.claude.outputs.execution_file }},${{ steps.refute.outputs.execution_file }}
          MODEL: ${{ inputs.model || 'claude-sonnet-5' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # always() means this runs even if the harness checkout never happened
          [ -f .harness/scripts/telemetry.py ] || exit 0
          python3 .harness/scripts/telemetry.py

      # An issue is the dedup marker, so it is only written on success --
      # a rate-limited or timed-out run leaves no marker and gets retried.
      - name: Publish findings
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERIFY_EXPECTED: ${{ steps.triage.outputs.verify }}
          VERIFY_OUTCOME: ${{ steps.refute.outcome }}
        run: |
          set -euo pipefail
          # HEAD_SHA is unset if the fetch step never ran; always() gets us here
          # anyway, and -u would abort with a confusing error.
          SHA=${HEAD_SHA:-unknown}
          if [ ! -s review.md ]; then
            echo "No review produced for $UPSTREAM#${{ matrix.pr }} @ \`$SHA\` -- see logs." \
              >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # Verification is part of the deliverable, not a bonus. If pass 1 found
          # something and pass 2 did not get to attack it, publishing anyway would
          # file unverified findings under a title indistinguishable from a
          # complete review -- and the issue is the dedup marker, so the PR would
          # never be looked at again. Surface the work, record nothing, retry.
          if [ "${VERIFY_EXPECTED:-}" = "true" ] && [ "${VERIFY_OUTCOME:-}" != "success" ]; then
            {
              echo "## $UPSTREAM#${{ matrix.pr }} @ \`$SHA\` — UNVERIFIED"
              echo
              echo "Pass 1 produced findings but the verification pass did not"
              echo "complete (\`$VERIFY_OUTCOME\`). These have **not** been"
              echo "adversarially checked and are expected to contain false"
              echo "positives. No issue was filed, so this PR stays in the queue"
              echo "and will be reviewed again."
              echo
              cat review.md
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          {
            echo "## $UPSTREAM#${{ matrix.pr }} @ \`$SHA\`"
            echo "[Upstream PR](https://github.com/$UPSTREAM/pull/${{ matrix.pr }})"
            echo
            cat review.md
          } >> "$GITHUB_STEP_SUMMARY"
          gh label create "pr-${{ matrix.pr }}" --force >/dev/null 2>&1 || true
          labels="pr-${{ matrix.pr }}"

          # Severity labels, from findings that survived verification only --
          # refuted ones stay in the report but must not tag the issue.
          sevs=$(python3 .harness/scripts/labels.py review.md || true)
          for sev in $sevs; do
            case "$sev" in
              critical) colour=B60205 ;;
              high)     colour=D93F0B ;;
              medium)   colour=FBCA04 ;;
              low)      colour=0E8A16 ;;
              *)        continue ;;
            esac
            gh label create "$sev" --color "$colour" --force \
              --description "Review found a $sev severity issue" \
              >/dev/null 2>&1 || true
            labels="$labels,$sev"
          done

          [ -n "$sevs" ] && echo "labelling: $labels"

          # The title format is a contract: select_prs.py and status.py read the
          # "Review:" prefix and the 12-char SHA as the dedup record. Severity
          # goes in labels, not the title, so that contract stays untouched.
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "Review: $UPSTREAM#${{ matrix.pr }} @ $SHA" \
            --body-file review.md --label "$labels"

      # Head-of-line protection. Without a record of the attempt, a PR that
      # reliably fails or times out is the newest unreviewed item every tick
      # forever -- it blocks the queue and re-burns the budget each time.
      # `select` gives up on a SHA after MAX_ATTEMPTS of these, so one
      # transient failure still gets a retry.
      #
      # But only count attempts where the review actually got to run. Hitting a
      # Claude usage limit fails in seconds, and is a property of the account,
      # not of this PR -- counting those would march down the queue abandoning
      # every PR in it two ticks at a time. A real per-PR failure (a timeout on
      # a large diff) takes minutes, so elapsed time separates the two.
      - name: Record failed attempt
        if: failure() && env.HEAD_SHA != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MIN_REAL_ATTEMPT_SECONDS: "120"
        run: |
          set -euo pipefail
          started=${T0:-0}
          if [ "$started" = "0" ]; then
            echo "failed before the review started -- not counting an attempt"
            exit 0
          fi
          elapsed=$(( $(date +%s) - started ))
          if [ "$elapsed" -lt "$MIN_REAL_ATTEMPT_SECONDS" ]; then
            echo "review failed after ${elapsed}s -- too fast to be this PR's"
            echo "fault (usage limit, auth, or infrastructure). Not counting an"
            echo "attempt; this PR stays in the queue."
            {
              echo "### $UPSTREAM#${{ matrix.pr }} not reviewed"
              echo "Failed after ${elapsed}s — most likely a Claude usage limit."
              echo "The PR was **not** penalised and will be retried."
              echo ""
              echo "If this repeats, pause the drip:"
              echo '```'
              echo "gh variable set REVIEW_PAUSED --body 1 --repo $GITHUB_REPOSITORY"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "review failed after ${elapsed}s -- counting a real attempt"
          gh label create review-failed --force >/dev/null 2>&1 || true
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "Review FAILED: $UPSTREAM#${{ matrix.pr }} @ $HEAD_SHA" \
            --label review-failed \
            --body "Run did not produce a review after ${elapsed}s: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: review-${{ matrix.pr }}
          path: review.md
          if-no-files-found: ignore
