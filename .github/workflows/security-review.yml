name: Monero Security Review

on:
  workflow_dispatch:
    inputs:
      pr:
        description: "Upstream PR number, or 'sweep' to take the next MAX_AGE_DAYS/BATCH from the queue"
        required: true
        default: sweep
        type: string
      model:
        description: "Model"
        required: false
        default: claude-opus-5
        type: choice
        options:
          - claude-opus-5
          - claude-sonnet-5

  # Frequent, low-volume drip. One PR per tick keeps any single rolling 5-hour
  # Claude window carrying a small load instead of one daily burst that could
  # exhaust it and block your interactive sessions. Most ticks find nothing to
  # do and cost nothing. Left disabled until you have calibrated -- uncomment,
  # and see "the drip" in the README before you do.
  # schedule:
  #   - cron: "*/30 * * * *"

env:
  UPSTREAM: monero-project/monero
  # Only consider PRs touched this recently. Upstream is busier than it looks:
  # measured 2026-08-26, the starting queue is ~22 PRs at 1 day, ~33 at 2,
  # ~42 at 3. Start at 1 so the first drain is survivable, then widen.
  MAX_AGE_DAYS: 1
  # PRs reviewed per tick. Raising this is what reintroduces bursts.
  BATCH: 1

# One review at a time, repo-wide. Rapid ticks collapse into a single pending
# run rather than stacking, and no two runs can pick the same PR concurrently.
concurrency:
  group: monero-review
  cancel-in-progress: false

permissions: {}

jobs:
  # The work queue. A manual dispatch with a number reviews exactly that PR.
  # Otherwise this picks unreviewed PRs -- deduplication happens HERE, from two
  # cheap API calls, so a tick with nothing to do never starts a review runner.
  select:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
    outputs:
      prs: ${{ steps.pick.outputs.prs }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - id: pick
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REVIEW_REPO: ${{ github.repository }}
          WANT: ${{ inputs.pr || 'sweep' }}
          PAUSED: ${{ vars.REVIEW_PAUSED }}
        run: |
          set -euo pipefail
          if [[ "$WANT" =~ ^[0-9]+$ ]]; then
            echo "prs=[\"$WANT\"]" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Kill switch: `gh variable set REVIEW_PAUSED --body 1` stops the drip
          # without editing the cron. Manual dispatches still work.
          if [ "${PAUSED:-}" = "1" ] && [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            echo "sweep paused via REVIEW_PAUSED"
            echo "prs=[]" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 scripts/select_prs.py >> "$GITHUB_OUTPUT"

  review:
    needs: select
    if: needs.select.outputs.prs != '' && needs.select.outputs.prs != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      issues: write
      id-token: write
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        pr: ${{ fromJSON(needs.select.outputs.prs) }}
    steps:
      # Every PR in a public repo exposes its head at refs/pull/N/head, so no
      # mirror is needed. Blobless partial clone keeps this fast on a ~208MB
      # repo while retaining the history that merge-base needs.
      - name: Fetch upstream PR ${{ matrix.pr }}
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-tags --single-branch --branch master \
            "https://github.com/$UPSTREAM.git" .
          git fetch --filter=blob:none origin \
            "+refs/pull/${{ matrix.pr }}/head:refs/heads/pr"
          git checkout --quiet pr
          # Fixed 12 chars, not --short: `select` compares against this prefix
          # and git's abbreviation length is not stable across repo states.
          echo "HEAD_SHA=$(git rev-parse HEAD | cut -c1-12)" >> "$GITHUB_ENV"

      - name: Fetch PR description
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/$UPSTREAM/pulls/${{ matrix.pr }}" \
            --jq '"# \(.title)\n\n\(.body // "(no description)")"' > PR_CONTEXT.md

      # The skill lives in this repo, not in Monero. Graft it onto the checkout.
      - name: Add the review skill
        uses: actions/checkout@v6
        with:
          path: .harness
          persist-credentials: false
      - run: cp -r .harness/.claude .claude

      - run: echo "T0=$(date +%s)" >> "$GITHUB_ENV"

      # No GitHub tools, no network: Claude reads the diff and writes review.md.
      # The workflow, not the model, decides what happens to that file. The code
      # under review is written by strangers, so it gets no outward capability.
      - id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: "/monero-security-review"
          claude_args: |
            --model ${{ inputs.model || 'claude-sonnet-5' }}
            --max-turns 60
            --allowedTools "Read,Grep,Glob,Write,Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git merge-base:*)"

      # Footer with cost/tokens/duration. Generated by the workflow, not the
      # model, so the numbers can't be invented. Never fails the job.
      - name: Append run telemetry
        if: always()
        env:
          EXEC_FILE: ${{ steps.claude.outputs.execution_file }}
          MODEL: ${{ inputs.model || 'claude-sonnet-5' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 .harness/scripts/telemetry.py

      # An issue is the dedup marker, so it is only written on success --
      # a rate-limited or timed-out run leaves no marker and gets retried.
      - name: Publish findings
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ ! -s review.md ]; then
            echo "No review produced for $UPSTREAM#${{ matrix.pr }} @ \`$HEAD_SHA\` -- see logs." \
              >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "## $UPSTREAM#${{ matrix.pr }} @ \`$HEAD_SHA\`"
            echo "[Upstream PR](https://github.com/$UPSTREAM/pull/${{ matrix.pr }})"
            echo
            cat review.md
          } >> "$GITHUB_STEP_SUMMARY"
          gh label create "pr-${{ matrix.pr }}" --force >/dev/null 2>&1 || true
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "Review: $UPSTREAM#${{ matrix.pr }} @ $HEAD_SHA" \
            --body-file review.md --label "pr-${{ matrix.pr }}"

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: review-${{ matrix.pr }}
          path: review.md
          if-no-files-found: ignore
