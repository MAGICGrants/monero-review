# Is GitHub's scheduler working for this repo at all?
#
# Deliberately has NO workflow_dispatch and no other trigger, so every run this
# workflow ever produces is provably schedule-fired. That is what makes it a
# witness: `gh run list --workflow cron-canary.yml` firing while the review
# workflow stays silent means the fault is that workflow's registration, not
# the repo or the account.
#
# Reading it:
#   canary fires, review.yml does not  -> review.yml's cron registration is
#                                         stuck; rename it again to force a
#                                         fresh workflow record.
#   neither fires within an hour        -> schedules are suppressed repo- or
#                                         account-wide. Renaming will not help;
#                                         open a GitHub Support ticket and rely
#                                         on the external driver.
#   both fire                           -> whatever broke it was transient.
#
# Six ticks an hour at ~10 seconds of runner time each. Delete this file once
# the question is settled.
name: cron-canary

on:
  schedule:
    - cron: "3,13,23,33,43,53 * * * *"

permissions: {}

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Record that the scheduler fired
        run: |
          echo "scheduler fired at $(date -u --iso-8601=seconds)" \
            >> "$GITHUB_STEP_SUMMARY"
